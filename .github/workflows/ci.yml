name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome check .
      - run: pnpm --filter web lint
      - run: pnpm --filter @schemio/ui lint
      - run: pnpm --filter web test
      - run: pnpm --filter @schemio/ui test
      - run: pnpm --filter web build

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost/ci_placeholder
      JWT_SECRET: ci_placeholder_jwt_secret_at_least_32_chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -v

  api-client-schema:
    runs-on: ubuntu-latest
    needs: [web, api]
    env:
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost/ci_placeholder
      JWT_SECRET: ci_placeholder_jwt_secret_at_least_32_chars
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pnpm install --frozen-lockfile
      - run: pip install -e ".[dev]"
        working-directory: apps/api
      - run: python scripts/export_openapi.py
        working-directory: apps/api
      - run: pnpm generate
        working-directory: packages/api-client
      - run: git diff --exit-code packages/api-client/src/schema.ts packages/api-client/openapi.json

  deploy-manifest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost/ci_placeholder
      JWT_SECRET: ci_placeholder_jwt_secret_at_least_32_chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r ../../api/requirements.txt
      - run: python -c "from src.main import app; print(app.title)"
